<?xml version="1.0" encoding="UTF-8"?>
<!--
  The initial "A" from the wordmark, on its own.

  Lifted verbatim from wordmark.svg — the same outlined Luke glyph, the same path data, byte for
  byte. It is a separate file rather than an index into that one because a mark and a wordmark are
  different pieces of artwork with different jobs: the wordmark is the masthead, this is what fits
  in a square. Editing either should not silently change the other.

  Two properties this file keeps, for the same reasons wordmark.svg keeps them:

  1. `fill="currentColor"`, no hard-coded colour. Ink on paper in light, paper on ink in dark.
  2. A tight `viewBox` and no width/height. The box is the glyph's own bounding box, measured by
     rendering it at 10x and trimming, so `scripts/build-assets.mjs` can centre it in a square
     without guessing at whitespace. The y origin is 1.2 rather than 0 because the "A" sits below
     the wordmark box's cap line, and shifting the path to compensate would mean editing the path.
-->
