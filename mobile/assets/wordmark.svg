<!--
  The masthead wordmark: "Arbini Family" set in Luke (the face the web loads from Typekit) and
  converted to outlines.

  Outlines rather than an embedded font on purpose. Adobe Fonts does not licence bundling a font
  into an app binary, but this is artwork, not a font — and the wordmark is the one string in the
  app that never changes, so nothing is lost by fixing it at design time.

  Two properties this file has to keep, both relied on by src/components/wordmark.tsx:

  1. `fill="currentColor"` on every path and no hard-coded colour anywhere. The wordmark is ink on
     paper in light mode and paper on ink in dark; the component passes the right one as `color`.
     (The export carried `#231f20`; it was rewritten here.)
  2. A tight `viewBox` and no `width`/`height` attributes. The component sizes by width and derives
     height from WORDMARK_ASPECT_RATIO, which must match this viewBox.
-->
