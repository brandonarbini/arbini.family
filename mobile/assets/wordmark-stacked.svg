<?xml version="1.0" encoding="UTF-8"?>
<!--
  The splash wordmark: "Arbini Family" set in Luke and converted to outlines, stacked onto two
  lines. The single-line cut is assets/wordmark.svg — that one is the masthead inside the app, where
  the header is wide and one line fits. This one is the launch screen, where the canvas is a whole
  portrait phone and a 6.7:1 sliver of a wordmark wastes it.

  Set by hand rather than derived by splitting the single-line file's per-letter paths. The split
  itself is trivial; the leading and the centring are not. Both words lead with a letter whose
  flourish reaches out past the rest of the line — the A's swash below and to the left, the F's
  above — so centring on bounding boxes lands visibly off-axis. This is optically centred instead.

  Outlines rather than an embedded font for the same reason as the single-line cut: Adobe Fonts does
  not licence bundling a font into an app binary, but this is artwork, not a font.

  Two properties this file has to keep, both relied on by scripts/build-assets.mjs:

  1. `fill="currentColor"` on every path and no hard-coded colour. The script substitutes a literal
     hex per raster — paper on the red splash, red on the dark one. (The export carried `#231f20`;
     it was rewritten here.)
  2. A `viewBox` tight on all four sides, and no `width`/`height` attributes. The script renders the
     whole box at scale and does not trim, so padding baked in here becomes padding in the PNG, and
     expo-splash-screen then centres the padded rectangle rather than the artwork. WORDMARK in the
     script must match this viewBox.
-->
