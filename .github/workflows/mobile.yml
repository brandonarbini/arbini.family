# The Expo app's checks.
#
# A separate workflow rather than a job in ci.yml on purpose: that file is generated
# (`# Generated by dev-env — run: pnpm dev-env plan arbini.family`) and a job added to it would be
# lost the next time it is regenerated. This file is not owned by that tool.
#
# Every step runs from `mobile/`, which resolves its own dependencies: the empty workspace root in
# `mobile/pnpm-workspace.yaml` makes pnpm stop walking up rather than find the repository's.
#
# Deliberately *without* `--ignore-workspace`. That flag looks like it belongs here, and it is what
# the local instructions used to say — but it tells pnpm to ignore the workspace file entirely,
# including the `allowBuilds` entries in it. The install then fails on an unapproved build script
# for `unrs-resolver`. The empty workspace root already provides the isolation; the flag only
# discards the configuration that goes with it.
name: Mobile

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]

jobs:
  mobile:
    name: Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          # `.node-version` pins 24 while a Mac dev host may be on 26. CI takes the lower bound,
          # which is the stricter check of the two.
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Generates `expo-env.d.ts` and `.expo/types`, both gitignored and both referenced by
      # tsconfig's `include`. Without this, tsc fails on the side-effect import of `@/global.css`.
      - run: pnpm exec expo customize tsconfig.json

      - run: pnpm exec tsc --noEmit

      - run: pnpm exec eslint .

      - run: pnpm exec prettier --check .
