# Generated by dev-env — run: pnpm dev-env plan arbini.family
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
      - pnpm-store:/home/node/.pnpm-store
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    command: sleep infinity

    network_mode: service:db

  db:
    image: postgres:17
    restart: unless-stopped
    volumes:
      - postgres-17-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres

volumes:
  postgres-17-data:
  pnpm-store:
    external: true
    name: pnpm-store-shared
