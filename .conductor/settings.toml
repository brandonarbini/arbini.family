"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

# Generated by dev-env — run: pnpm dev-env plan arbini.family
[scripts]
setup = "./.conductor/setup.sh"
archive = "./.conductor/archive.sh"
run_mode = "concurrent"

[scripts.run.dev]
command = '"$CONDUCTOR_ROOT_PATH/.conductor/run-dev.sh"'
default = true
icon = "play"
available_in = ["local"]

[scripts.run.rebuild]
command = "\"$CONDUCTOR_ROOT_PATH/.conductor/rebuild.sh\""
icon = "wrench"
available_in = ["local"]
