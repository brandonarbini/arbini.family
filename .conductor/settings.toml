"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

# Generated by dev-env — run: pnpm dev-env plan arbini.family
[scripts]
setup = "./.conductor/setup.sh"
archive = "./.conductor/archive.sh"
run_mode = "concurrent"

[scripts.run.dev]
command = '"$CONDUCTOR_ROOT_PATH/.conductor/run-dev.sh"'
default = true
icon = "play"
available_in = ["local"]

[scripts.run.rebuild]
command = "\"$CONDUCTOR_ROOT_PATH/.conductor/rebuild.sh\""
icon = "wrench"
available_in = ["local"]

[scripts.run.seed]
command = "devcontainer up --workspace-folder . >/dev/null && devcontainer exec --workspace-folder . pnpm db:seed"
icon = "sprout"
available_in = ["local"]

[scripts.run.migrate]
command = "devcontainer up --workspace-folder . >/dev/null && devcontainer exec --workspace-folder . pnpm prisma:initialize"
icon = "database"
available_in = ["local"]

[scripts.run.studio]
command = "\"$CONDUCTOR_ROOT_PATH/.conductor/run-studio.sh\""
icon = "database"
available_in = ["local"]

[scripts.run.email]
command = "devcontainer up --workspace-folder . >/dev/null && devcontainer exec --workspace-folder . pnpm dev:email"
icon = "mail"
available_in = ["local"]
